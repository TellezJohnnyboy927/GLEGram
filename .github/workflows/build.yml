name: Build MQGram

on:
  push:
    branches: [main]
    tags: ['v*', 'build-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number override (leave empty for auto from commit count)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Bazel with embedded JDK 24 crashes on macOS 15+ — use system JDK 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize Bazel rule submodules
        # build-system/bazel-rules/* are referenced via local_path_override in MODULE.bazel
        # but were never committed as gitlinks in this repository.  Clone them manually
        # at the exact commits used by the upstream Swiftgram project.
        run: |
          mkdir -p build-system/bazel-rules

          _clone_at() {
            local dir="$1" url="$2" sha="$3"
            mkdir -p "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch --depth=1 -q origin "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
          }

          _clone_at build-system/bazel-rules/rules_xcodeproj \
            https://github.com/MobileNativeFoundation/rules_xcodeproj.git \
            79f26ec1315531a8459fe95934440cb3ca3c16df

          _clone_at build-system/bazel-rules/rules_apple \
            https://github.com/ali-fareed/rules_apple.git \
            39cc2529241335d20afcb6700c587d064e7a2870

          _clone_at build-system/bazel-rules/rules_swift \
            https://github.com/bazelbuild/rules_swift.git \
            2b9261134a123ad83f8b1d2dc7fc69ae83fe7172

          _clone_at build-system/bazel-rules/apple_support \
            https://github.com/bazelbuild/apple_support.git \
            7967e453d1f54963935a1ae06808e1c64420bfb1

          _clone_at build-system/bazel-rules/sourcekit-bazel-bsp \
            https://github.com/spotify/sourcekit-bazel-bsp.git \
            e2e532ab9d9296343ce77c93286dd7d472947157

      - name: Set Xcode version
        run: |
          XCODE_VERSION=$(python3 -c 'import json; d=json.load(open("versions.json")); print(d["xcode"])')
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
            echo "Activated Xcode ${XCODE_VERSION}"
          else
            echo "Xcode ${XCODE_VERSION} not found at $XCODE_PATH, using default: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.API_ID }}" ] || [ -z "${{ secrets.API_HASH }}" ]; then
            echo "::error::Required secrets API_ID and API_HASH are not set."
            echo "  Go to Settings → Secrets → Actions and add:"
            echo "  - API_ID   (from https://my.telegram.org)"
            echo "  - API_HASH (from https://my.telegram.org)"
            exit 1
          fi

      - name: Create build configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          python3 - <<'EOF'
          import json, os
          # Default to the bundle_id / team_id that ship with the fake codesigning
          # profiles under build-system/fake-codesigning/profiles/.  Using the same
          # values means entitlements validation passes and watchOS targets get a
          # valid provisioning_profile (the watchos_application rule does NOT accept
          # `None`, unlike the iOS extension rules).
          cfg = {
              "bundle_id": os.environ.get("BUNDLE_ID") or "ph.telegra.Telegraph",
              "api_id": os.environ["API_ID"],
              "api_hash": os.environ["API_HASH"],
              "team_id": os.environ.get("TEAM_ID") or "C67CF9S4VU",
              "app_center_id": "0",
              "is_internal_build": "false",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "tg",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
              "sg_config": ""
          }
          path = "build-system/ci-configuration.json"
          with open(path, "w") as f:
              json.dump(cfg, f, indent="\t")
          print(f"Created {path} (bundle_id={cfg['bundle_id']})")
          EOF

      - name: Copy sources to canonical path
        # Source paths are embedded in the binary; a stable path makes builds reproducible.
        run: |
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Cache Bazel output
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('WORKSPACE', 'variables.bzl') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Compute build number and app version
        id: meta
        run: |
          SOURCE_DIR=/Users/Shared/telegram-ios
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          else
            OFFSET=$(cat "$SOURCE_DIR/build_number_offset" 2>/dev/null || echo 0)
            COMMIT_COUNT=$(git -C "$SOURCE_DIR" rev-list --count HEAD)
            BUILD_NUMBER=$((COMMIT_COUNT + OFFSET))
          fi
          APP_VERSION=$(python3 -c 'import json; d=json.load(open("/Users/Shared/telegram-ios/versions.json")); print(d["app"])')
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "MQGram $APP_VERSION build $BUILD_NUMBER"

      - name: Import fake certificates
        run: |
          cd /Users/Shared/telegram-ios
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Build MQGram (release_arm64)
        run: |
          set -euo pipefail
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          CACHE_DIR="$HOME/telegram-bazel-cache"
          cd "$SOURCE_DIR"
          python3 -u build-system/Make/Make.py \
            --cacheDir="$CACHE_DIR" \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/ci-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --target MQGram

      - name: Collect artifacts
        run: |
          SOURCE_DIR=/Users/Shared/telegram-ios
          cd "$SOURCE_DIR"
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          # IPA — prefer the bazel-bin symlink (always points to the current
          # configuration), fall back to a recursive search under bazel-out.
          IPA_FOUND=0
          if [ -f bazel-bin/Telegram/MQGram.ipa ]; then
            cp -L bazel-bin/Telegram/MQGram.ipa "$OUTPUT_PATH/MQGram.ipa"
            IPA_FOUND=1
          else
            CANDIDATE=$(find bazel-out -path '*/bin/Telegram/MQGram.ipa' -type f 2>/dev/null | head -n 1)
            if [ -z "$CANDIDATE" ]; then
              CANDIDATE=$(find bazel-out -path '*/bin/Telegram/*.ipa' -type f 2>/dev/null | head -n 1)
            fi
            if [ -n "$CANDIDATE" ]; then
              cp "$CANDIDATE" "$OUTPUT_PATH/MQGram.ipa"
              IPA_FOUND=1
            fi
          fi
          if [ "$IPA_FOUND" = "0" ]; then
            echo "::error::No IPA found under bazel-bin or bazel-out"
            echo "bazel-bin/Telegram listing:"
            ls -la bazel-bin/Telegram 2>&1 || true
            echo "find bazel-out:"
            find bazel-out -name '*.ipa' 2>/dev/null | head -n 20 || true
            exit 1
          fi

          # dSYMs — collect everything Bazel generated alongside the IPA
          mkdir -p build/DSYMs
          # First, anything next to the symlinked IPA target.
          for f in bazel-bin/Telegram/*.dSYM bazel-bin/Telegram/*.framework.dSYM bazel-bin/Telegram/*.appex.dSYM; do
            [ -e "$f" ] && cp -RL "$f" build/DSYMs/ 2>/dev/null || true
          done
          # And anything else Bazel emitted under bazel-out.
          while IFS= read -r f; do
            [ -d "$f" ] && cp -R "$f" build/DSYMs/ 2>/dev/null || true
          done < <(find bazel-out -path '*/bin/Telegram/*.dSYM' -prune 2>/dev/null)
          zip -r "$OUTPUT_PATH/MQGram.DSYMs.zip" build/DSYMs 1>/dev/null || true

          echo "Artifacts:"
          ls -lh "$OUTPUT_PATH/"

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MQGram-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/MQGram.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: MQGram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Unsigned MQGram ${{ env.APP_VERSION }} build ${{ env.BUILD_NUMBER }}

            > ⚠️ **Unsigned IPA** — built with fake codesigning certificates.
            > You must resign it with your own developer certificate before installing.
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/MQGram.ipa
            /Users/Shared/telegram-ios/build/artifacts/MQGram.DSYMs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
